<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Non Potes. But You Can Vote. — Aahil Hasan</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Playfair+Display:ital,wght@0,400;0,900;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0ece4; margin: 0; padding: 0; }

    .poster {
      width: 8.27in;
      height: 11.69in;
      margin: 20px auto;
      background: #ffffff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0.3in 0.38in;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
    }

    /* ── TOP TEXT SECTION ── */
    .top-section {
      width: 100%;
      text-align: center;
      flex-shrink: 0;
      padding-bottom: 0.18in;
      border-bottom: 3px solid #c9a227;
      margin-bottom: 0.2in;
    }

    .massjcl-tag {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      color: #c9a227;
      text-transform: uppercase;
      font-weight: 600;
      display: block;
      margin-bottom: 0.06in;
    }

    .candidate-name {
      font-family: 'Cinzel', serif;
      font-size: 2.7rem;
      font-weight: 700;
      color: #2d1b69;
      letter-spacing: 0.06em;
      display: block;
      margin-bottom: 0.1in;
      line-height: 1.05;
    }

    .non-potes {
      font-family: 'Cinzel', serif;
      font-size: 4.6rem;
      font-weight: 900;
      color: #2d1b69;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      line-height: 0.95;
      display: block;
    }

    .translation {
      font-family: 'Playfair Display', serif;
      font-size: 0.88rem;
      font-style: italic;
      color: rgba(45,27,105,0.45);
      display: block;
      margin-top: 0.07in;
      letter-spacing: 0.08em;
    }

    /* ── IMAGE ── */
    .image-frame {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 0;
      padding: 0.05in;
    }

    .image-frame img {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      display: block;
      border: 3px solid #c9a227;
      box-shadow: 0 6px 28px rgba(45,27,105,0.14), 4px 4px 0 #c9a227;
    }

    /* ── BOTTOM TEXT SECTION ── */
    .bottom-section {
      width: 100%;
      text-align: center;
      flex-shrink: 0;
      padding-top: 0.18in;
      border-top: 3px solid #c9a227;
      margin-top: 0.2in;
    }

    .but-vote {
      font-family: 'Cinzel', serif;
      font-size: 2.0rem;
      font-weight: 700;
      color: #2d1b69;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: block;
      margin-bottom: 0.1in;
    }

    .vote-call {
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      letter-spacing: 0.25em;
      color: #c9a227;
      text-transform: uppercase;
      font-weight: 700;
    }

    @media print {
      @page { size: A4; margin: 0; }
      body { margin: 0; padding: 0; background: #ffffff; }
      .poster { margin: 0; box-shadow: none; width: 100vw; height: 100vh; }
    }
  </style>
</head>
<body>
  <div class="poster">

    <div class="top-section">
      <span class="massjcl-tag">Massachusetts Junior Classical League · 2026–2027</span>
      <span class="candidate-name">Aahil Hasan</span>
      <span class="non-potes">NON POTES.</span>
      <span class="translation">You Can't Touch This</span>
    </div>

    <div class="image-frame">
      <img src="behind.jpg" alt="Aahil Hasan holding trophies — HOC TANGERE NON POTES shorts"/>
    </div>

    <div class="bottom-section">
      <span class="but-vote">But you can vote.</span>
      <span class="vote-call">Aahil Hasan for MassJCL President · 2026–2027</span>
    </div>

  </div>
</body>
</html>
