<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Aahil for Prez</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@900&family=Lato:wght@900&display=swap" rel="stylesheet"/>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0ece4; margin: 0; padding: 20px; }

    .poster {
      width: 8.27in;
      height: 11.69in;
      margin: 0 auto;
      background: #ffffff;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: row;
    }

    /* ── LEFT: TEXT SIDE ── */
    .text-side {
      width: 55%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      flex-shrink: 0;
    }

    /* ── RIGHT: PHOTO SIDE ── */
    .photo-side {
      flex: 1;
      position: relative;
      overflow: hidden;
    }
    .photo-side img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    /* Gold border on left edge of photo */
    .photo-side::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
      background: linear-gradient(to bottom, transparent, #c9a227 20%, #c9a227 80%, transparent);
      z-index: 3;
    }

    /* ── BACKGROUND EMBELLISHMENTS ── */
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1px solid rgba(201,162,39,0.1);
      pointer-events: none;
    }
    .corner {
      position: absolute;
      width: 0.7in;
      height: 0.7in;
      pointer-events: none;
      z-index: 3;
    }
    .corner-tl { top: 0.22in; left: 0.22in; border-top: 2.5px solid rgba(201,162,39,0.4); border-left: 2.5px solid rgba(201,162,39,0.4); }
    .corner-bl { bottom: 0.22in; left: 0.22in; border-bottom: 2.5px solid rgba(201,162,39,0.4); border-left: 2.5px solid rgba(201,162,39,0.4); }
    .star {
      position: absolute;
      font-family: serif;
      color: rgba(201,162,39,0.16);
      pointer-events: none;
      user-select: none;
      z-index: 1;
    }
    .bg-rule {
      position: absolute;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(45,27,105,0.06), transparent);
      pointer-events: none;
    }

    /* ── TEXT BLOCK ── */
    .graffiti-block {
      transform: rotate(-12deg);
      text-align: left;
      line-height: 0.88;
      position: relative;
      z-index: 2;
    }

    .tag {
      font-family: 'Cinzel', serif;
      font-weight: 900;
      display: block;
      paint-order: stroke fill;
      letter-spacing: 0.02em;
    }

    .aahil {
      font-size: 5.8rem;
      color: #2d1b69;
      -webkit-text-stroke: 4px #c9a227;
      text-shadow: 5px 5px 0 rgba(201,162,39,0.2);
    }

    .for-word {
      font-family: 'Lato', sans-serif;
      font-weight: 900;
      font-size: 1.3rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #c9a227;
      display: block;
      margin-left: 0.12in;
      margin-top: 0.06in;
      margin-bottom: 0.02in;
    }

    .massjcl {
      font-size: 3.6rem;
      color: #c9a227;
      -webkit-text-stroke: 3.5px #2d1b69;
      text-shadow: 4px 4px 0 rgba(45,27,105,0.16);
    }

    .prez {
      font-size: 7.4rem;
      color: #2d1b69;
      -webkit-text-stroke: 5px #c9a227;
      text-shadow: 6px 6px 0 rgba(201,162,39,0.2);
      margin-top: -0.02in;
    }

    .certified {
      font-size: 2rem;
      color: #c9a227;
      -webkit-text-stroke: 2.5px #2d1b69;
      text-shadow: 3px 3px 0 rgba(45,27,105,0.15);
      margin-top: 0.18in;
      border-top: 2px solid rgba(201,162,39,0.4);
      padding-top: 0.1in;
    }

    @media print {
      @page { size: A4; margin: 0; }
      body { margin: 0; padding: 0; background: #ffffff; }
      .poster { margin: 0; box-shadow: none; width: 100vw; height: 100vh; }
    }
  </style>
</head>
<body>
<div class="poster">

  <!-- ── LEFT TEXT SIDE ── -->
  <div class="text-side">

    <!-- bg rings -->
    <div class="ring" style="width:8in;height:8in;top:-2in;left:-2in;"></div>
    <div class="ring" style="width:5.5in;height:5.5in;top:-0.5in;left:-0.5in;border-color:rgba(201,162,39,0.07);"></div>
    <div class="ring" style="width:3in;height:3in;top:2.5in;left:0.5in;border-color:rgba(45,27,105,0.06);"></div>

    <!-- diagonal rules -->
    <div class="bg-rule" style="width:130%;top:1.8in;left:-15%;transform:rotate(-12deg);"></div>
    <div class="bg-rule" style="width:130%;top:5.5in;left:-15%;transform:rotate(-12deg);"></div>
    <div class="bg-rule" style="width:130%;top:9in;left:-15%;transform:rotate(-12deg);"></div>

    <!-- stars -->
    <div class="star" style="font-size:4rem;top:0.4in;left:0.5in;">✦</div>
    <div class="star" style="font-size:2rem;top:1.1in;left:3.2in;transform:rotate(15deg);">✦</div>
    <div class="star" style="font-size:3rem;bottom:0.8in;left:0.3in;transform:rotate(-8deg);">✦</div>
    <div class="star" style="font-size:1.5rem;bottom:1.6in;left:3.0in;transform:rotate(20deg);">✦</div>

    <!-- corner ornaments -->
    <div class="corner corner-tl"></div>
    <div class="corner corner-bl"></div>

    <!-- TEXT -->
    <div class="graffiti-block">
      <span class="tag aahil">AAHIL</span>
      <span class="for-word">FOR</span>
      <span class="tag massjcl">MASSJCL</span>
      <span class="tag prez">PREZ</span>
      <span class="tag certified">CERTIFIED FUNKY ✓</span>
    </div>

  </div>

  <!-- ── RIGHT PHOTO SIDE ── -->
  <div class="photo-side">
    <img src="chicken.jpeg" alt="Aahil Hasan in chicken costume"/>
  </div>

</div>
</body>
</html>
